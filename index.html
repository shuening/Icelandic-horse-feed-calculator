<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
/* Colorblind-friendly palette (Wong / IBM safe) */
--bg:#f5f0eb;--card:#fff;--primary:#4a3728;--primary-light:#7a6455;--accent:#0072b2;
--accent-light:#56b4e9;--text:#2e2420;--text-light:#6b5f59;--border:#e0d5cc;

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:72px}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:16px 20px 12px;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.tabs{display:flex;overflow-x:auto;gap:4px;background:var(--primary);padding:0 12px;position:sticky;top:52px;z-index:99;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 14px;color:rgba(255,255,255,.65);font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;transition:.2s}
.tab.active{color:#fff;border-bottom-color:var(--accent-light)}
.tab:hover{color:rgba(255,255,255,.9)}
.page{display:none;padding:16px;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px;border:1px solid var(--border)}
.card h3{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.3px}
/* Colorblind-safe badge colors — high contrast, distinguishable shapes via text */
.badge-senior{background:#f0e6d3;color:#7a5c00}
.badge-pssm{background:#fce4d6;color:#d55e00}
.badge-teeth{background:#fff2cc;color:#b27300}
.badge-digestive{background:#d9f2e6;color:#006b52}
.badge-ir{background:#fce4d6;color:#d55e00}
.badge-overweight{background:#fff2cc;color:#b27300}
.badge-hoof{background:#dce9f7;color:#005a9e}
.badge-healthy{background:#d9f2e6;color:#006b52}
.target-bar{height:8px;background:#e8e0d8;border-radius:4px;margin:8px 0;overflow:visible;position:relative}
.target-fill{height:100%;border-radius:4px;transition:width .4s ease;position:relative}
.target-fill.under{background:var(--warning)}
.target-fill.good{background:var(--success)}
.target-fill.over{background:var(--danger)}
.target-range{display:flex;justify-content:space-between;font-size:11px;color:var(--text-light);margin-top:2px}
.target-label{font-size:13px;font-weight:600;margin-top:4px}
.feed-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.feed-row:last-child{border-bottom:none}
.feed-name{font-size:13px;flex:1;min-width:0}
.feed-name small{display:block;color:var(--text-light);font-size:11px}
.feed-controls{display:flex;align-items:center;gap:6px}
.feed-controls button{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--bg);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--primary);font-weight:700;transition:.15s}
.feed-controls button:active{background:var(--primary);color:#fff}
.feed-controls input{width:52px;text-align:center;border:1px solid var(--border);border-radius:8px;padding:4px;font-size:14px;font-weight:600}
.feed-controls .unit{font-size:11px;color:var(--text-light);width:20px}
.feed-rec{font-size:11px;color:var(--accent);font-weight:600}
.notes{background:#faf7f3;border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 8px 8px 0;margin-top:8px;font-size:13px;color:var(--text-light)}
.supp-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px}
.supp-row:last-child{border-bottom:none}
.supp-toggle{position:relative;width:42px;height:24px;flex-shrink:0}
.supp-toggle input{opacity:0;width:0;height:0}
.supp-toggle .slider{position:absolute;inset:0;background:#ccc;border-radius:24px;cursor:pointer;transition:.2s}
.supp-toggle .slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.supp-toggle input:checked+.slider{background:var(--accent)}
.supp-toggle input:checked+.slider:before{transform:translateX(18px)}
.supp-info{flex:1;min-width:0}
.supp-info .name{font-size:13px;font-weight:600}
.supp-info .desc{font-size:11px;color:var(--text-light)}
.supp-dose{display:flex;align-items:center;gap:4px}
.supp-dose input{width:40px;text-align:center;border:1px solid var(--border);border-radius:6px;padding:3px;font-size:13px}
.supp-dose .unit{font-size:11px;color:var(--text-light)}
.summary-table{width:100%;font-size:13px;border-collapse:collapse}
.summary-table th{text-align:left;padding:8px 6px;border-bottom:2px solid var(--border);font-size:12px;color:var(--text-light);font-weight:600}
.summary-table td{padding:6px;border-bottom:1px solid var(--border)}
.summary-table tr:last-child td{border-bottom:none}
.summary-table .total-row{font-weight:700;background:var(--bg)}
.btn{padding:10px 20px;border-radius:var(--radius);border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:var(--primary-light)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:active{background:var(--accent-light)}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-block{display:block;width:100%;text-align:center}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--text-light)}
.form-group input,.form-group select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--card)}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary)}
.horse-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.horse-tab{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:2px solid var(--border);background:var(--card);white-space:nowrap;transition:.2s}
.horse-tab.active{border-color:var(--primary);background:var(--primary);color:#fff}
.log-entry{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
.log-entry:last-child{border-bottom:none}
.log-date{font-weight:600;font-size:14px}
.log-actions{display:flex;gap:6px}
.chart-container{position:relative;width:100%;height:280px;margin:12px 0}
canvas{width:100%!important;height:100%!important}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.pasture-toggle{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:8px;margin-bottom:8px}
.conditions-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.season-toggle{display:flex;gap:8px;margin-bottom:16px}
.season-btn{flex:1;padding:10px;border:2px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;background:var(--card);transition:.2s}
.season-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.horse-settings-card{margin-bottom:16px}
.condition-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:var(--bg);cursor:pointer;transition:.15s}
.condition-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.sync-status{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 10px;border-radius:8px;margin-bottom:8px}
.sync-status.online{background:#d9f2e6;color:#006b52}
.sync-status.offline{background:#fce4d6;color:#d55e00}
.sync-status .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sync-status.online .dot{background:#009e73}
.sync-status.offline .dot{background:#d55e00}
.activity-selector{display:flex;gap:6px;flex-wrap:wrap}
.activity-opt{padding:6px 12px;border-radius:20px;font-size:12px;border:2px solid var(--border);cursor:pointer;background:var(--card);transition:.2s}
.activity-opt.active{border-color:var(--accent);background:var(--accent);color:#fff}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}.mt-8{margin-top:8px}.mt-16{margin-top:16px}
</style>

<script>
'use strict';
// ── Firebase Setup ──
const firebaseConfig={

};
const fbApp=firebase.initializeApp(firebaseConfig);
const fbDb=firebase.database();
let householdId=localStorage.getItem('hfc_household')||null;
let fbRef=null;
let fbConnected=false;
let syncPaused=false; // prevent echo loops

function initFirebaseSync(){
if(!householdId)return;
fbRef=fbDb.ref('households/'+householdId);
// Listen for remote changes
fbRef.on('value',snap=>{
if(syncPaused)return;
const remote=snap.val();
if(!remote)return;
const remoteTs=remote._ts||0;
const localTs=state._ts||0;
if(remoteTs>localTs){
// Remote is newer — merge
if(remote.adjustments)state.adjustments=remote.adjustments;
if(remote.supplements)state.supplements=remote.supplements;
if(remote.horses)state.horses=remote.horses;
if(remote.season)state.season=remote.season;
state._ts=remoteTs;
localStorage.setItem('hfc_state',JSON.stringify(state));
render();
}
});
// Connection status
fbDb.ref('.info/connected').on('value',snap=>{
fbConnected=!!snap.val();
if(typeof renderSettings==='function'&&selectedTab==='settings')renderSettings();
});
}

function pushToFirebase(){
if(!fbRef||syncPaused)return;
state._ts=Date.now();
syncPaused=true;
fbRef.set({
horses:state.horses,
adjustments:state.adjustments||{},
supplements:state.supplements||{},
season:state.season,
_ts:state._ts
}).then(()=>{syncPaused=false}).catch(()=>{syncPaused=false});
}

function setHousehold(id){
if(fbRef)fbRef.off();
householdId=id;
localStorage.setItem('hfc_household',id);
initFirebaseSync();
pushToFirebase();
}

function generateHouseholdId(){
const words=['tenor','odinn','uffie','spoi','horse','tolt','glacier','viking','saga','fjord'];
const a=words[Math.floor(Math.random()*words.length)];
const b=words[Math.floor(Math.random()*words.length)];
return a+'-'+b+'-'+Math.floor(Math.random()*9000+1000);
}

// ── Data Defaults ──
const FEED_TYPES=[
{id:'pasture',name:'Short-Grazed Pasture',unit:'risk',isPasture:true},
{id:'lmf_low_nsc_complete',name:'LMF Low NSC Complete',unit:'lb',horseIds:['tenor']},
{id:'teff_pellets',name:'Teff Grass Pellets',unit:'lb'}
];

const ALL_CONDITIONS=['senior','teeth','digestive','pssm','hoof','ir','overweight','healthy'];
const CONDITION_LABELS={senior:'Senior',teeth:'Teeth Problem',digestive:'Digestive Sensitive',pssm:'PSSM',hoof:'Hoof Care',ir:'Insulin Resistant',overweight:'Overweight',healthy:'Healthy'};
const CONDITION_BADGE={senior:'badge-senior',teeth:'badge-teeth',digestive:'badge-digestive',pssm:'badge-pssm',hoof:'badge-hoof',ir:'badge-ir',overweight:'badge-overweight',healthy:'badge-healthy'};

const ALL_SUPPS=[
{id:'amino_trace',name:'Mad Barn AminoTrace+',desc:'Low-NSC vitamin/mineral + amino acid balancer; no added iron',dose:3.5,unit:'oz',forAll:true,primary:true,mfgDose:'100 g (~3.5 oz) for 700 lb; 150 g for 900 lb',mfgNote:'Primary mineral base. Avoid stacking with other complete mineral bases without ration review.'},
{id:'health_e',name:'Health-E Vitamin E',desc:'High-potency vitamin E antioxidant support',dose:0.5,unit:'scoop',mfgDose:'Label is product-specific; app defaults low when combined with AminoTrace+',mfgNote:'Check actual IU per scoop/oz on your container; reduce if total Vitamin E target is already met.'},
{id:'assure_guard_gold',name:'AssureGuard Gold',desc:'Digestive support with psyllium, probiotics, enzymes, and buffering ingredients',dose:1,unit:'scoop',horseIds:['tenor'],mfgDose:'Ponies 501–800 lb: 1 scoop/day',mfgNote:'Tenor only in this plan. Do not duplicate with another daily gut product unless intended.'},
{id:'optimum_digestive',name:'Mad Barn Optimum Digestive Health',desc:'Prebiotic/probiotic hindgut support; alternative to AssureGuard Gold',dose:80,unit:'g',mfgDose:'80 g/day for 440–1100 lb',mfgNote:'Alternative gut support option; overlaps with AssureGuard Gold.'},
{id:'tumercicle',name:'Turmericle',desc:'Turmeric/curcumin botanical comfort support',dose:1,unit:'scoop',mfgDose:'Often 1 scoop for 500 lb; 2 scoops for 1000 lb',mfgNote:'Botanical comfort support; check label and competition medication rules.'},
{id:'super_sport',name:'Purina SuperSport',desc:'Amino acids for muscle support',dose:4,unit:'oz',mfgDose:'6 oz for 750 lb horse',mfgNote:'App dose is below label for 750 lb; reduced to limit overlap with other fortified products.'},
{id:'buteless',name:'Bute-Less',desc:'Comfort/recovery support; formula varies by product version',dose:1,unit:'scoop',mfgNote:'Check whether your container is original Bute-Less or Bute-Less Performance; active botanicals differ.'},
{id:'remission',name:'AniMed Remission',desc:'Hoof/metabolic support with magnesium, biotin, amino acids, chromium, and probiotics',dose:1,unit:'oz',mfgDose:'1 oz/day per 1000 lb; 0.5 oz maintenance',mfgNote:'Adds magnesium, zinc, biotin, chromium, and a small selenium contribution; review overlap with AminoTrace+.'}
];

// Condition → supplement recommendation rules
// Each rule: {suppId, conditions (any match triggers), reason}
const SUPP_RULES=[
{suppId:'super_sport',conditions:['pssm'],reason:'PSSM → amino acids for muscle maintenance'},
{suppId:'health_e',conditions:['pssm'],reason:'PSSM → vitamin E antioxidant support to review'},
{suppId:'assure_guard_gold',conditions:['senior','teeth','digestive'],reason:'Tenor digestive/teeth support → gut support'},
{suppId:'optimum_digestive',conditions:['digestive'],reason:'Digestive sensitive → alternative hindgut support'},
{suppId:'tumercicle',conditions:['hoof','senior','pssm'],reason:'Comfort/inflammatory support'},
{suppId:'remission',conditions:['hoof','ir','overweight'],reason:'Hoof/metabolic support'},
];
// Backward compat helpers
const BASE_SUPPS=ALL_SUPPS.filter(s=>s.forAll);
const TENOR_SUPPS=ALL_SUPPS.filter(s=>!s.forAll);

const DEFAULT_HORSES=[
{id:'tenor',name:'Tenor',weight:700,conditions:['senior','teeth','digestive','pssm','hoof'],activity:'moderate',emoji:'🐎'},
{id:'odinn',name:'Odinn',weight:700,conditions:['healthy'],activity:'moderate',emoji:'🏇',hidden:true},
{id:'uffie',name:'Uffie',weight:800,conditions:['healthy'],activity:'moderate',emoji:'🐴'},
{id:'spoi',name:'Spoi',weight:950,idealWeight:800,conditions:['ir','overweight'],activity:'moderate',emoji:'🐎'}
];

const ACTIVITIES=[{id:'light',label:'Light'},{id:'moderate',label:'Moderate (~1hr/day)'},{id:'heavy',label:'Heavy'}];

// ── State ──
let state=loadState();
let selectedHorse=0;
let selectedTab='recs';
let trendHorse=0;

// Auto-detect season based on US DST
// Summer = 2nd Sunday of March to 1st Sunday of November
function getAutoSeason(){
const now=new Date();
const year=now.getFullYear();
// 2nd Sunday of March
const mar1=new Date(year,2,1);
const marSun2=new Date(year,2,8+(7-mar1.getDay())%7+7);
// Actually: 2nd Sunday = day 8..14 that is Sunday
const dstStart=new Date(year,2,14-(new Date(year,2,1).getDay()+6)%7);
// Simpler: find 2nd Sunday of March
const marchFirst=new Date(year,2,1).getDay();// 0=Sun
const secondSunMar=14-((marchFirst+6)%7);
const dstOn=new Date(year,2,secondSunMar);
// 1st Sunday of November
const novFirst=new Date(year,10,1).getDay();
const firstSunNov=1+((7-novFirst)%7);
const dstOff=new Date(year,10,firstSunNov);
return(now>=dstOn&&now<dstOff)?'summer':'winter';
}

function defaultState(){
return{
horses:JSON.parse(JSON.stringify(DEFAULT_HORSES)),
season:getAutoSeason(),
feeds:{},supplements:{},adjustments:{}
};
}
function normalizeState(s){
if(!s.horses)s.horses=JSON.parse(JSON.stringify(DEFAULT_HORSES));
s.horses.forEach(h=>{
const def=DEFAULT_HORSES.find(d=>d.id===h.id);
if(def&&def.hidden!==undefined)h.hidden=def.hidden;
});
DEFAULT_HORSES.forEach(def=>{
if(!s.horses.some(h=>h.id===def.id))s.horses.push(JSON.parse(JSON.stringify(def)));
});
if(!s.adjustments)s.adjustments={};
if(!s.supplements)s.supplements={};
return s;
}
function loadState(){
try{const s=localStorage.getItem('hfc_state');if(s){
const parsed=JSON.parse(s);
// Auto-update season on each load
parsed.season=getAutoSeason();
return normalizeState(parsed);
}}catch(e){}
return defaultState();
}
function save(){
state._ts=Date.now();
localStorage.setItem('hfc_state',JSON.stringify(state));
pushToFirebase();
}

// ── Recommendation Engine ──
function getTargetRange(h){
const w=h.weight;
const hasIR=h.conditions.includes('ir');
const hasOW=h.conditions.includes('overweight');
if(hasIR||hasOW)return[w*0.012,w*0.015];
return[w*0.015,w*0.018];
}

function recommend(h){
const[lo,hi]=getTargetRange(h);
const mid=(lo+hi)/2;
const c=h.conditions;
const hasPSSM=c.includes('pssm');const hasTeeth=c.includes('teeth');
const hasIR=c.includes('ir');const hasOW=c.includes('overweight');
const hasDig=c.includes('digestive');const isSenior=c.includes('senior');

let r={pasture:false,lmf_low_nsc_complete:0,teff_pellets:0};
let notes=[];
notes.push('🌿 Pasture is currently short-grazed. In the Pacific Northwest, short regrowth and stem bases can be sugar-rich, so pasture is not counted as safe forage.');

// Tenor-like: senior+teeth+pssm
if(isSenior&&hasTeeth&&hasPSSM){
// LMF Low NSC Complete can serve as a complete low-sugar soaked mash for Tenor.
r.lmf_low_nsc_complete=+mid.toFixed(1);
notes.push('⚠️ PSSM: Keep starch/sugar low. LMF Low NSC Complete is listed by LMF as max 6% sugar and max 2% starch.');
notes.push('🦷 Teeth: feed as a well-soaked mash; keep long-stem hay/pasture intake conservative if chewing is unreliable.');
notes.push('🍽️ Split into 3-4 smaller meals throughout the day');
if(c.includes('hoof'))notes.push('🐴 Hoof/metabolic support: watch total minerals when combining AminoTrace+ and Remission.');
}
// IR/overweight (Spoi-like)
else if(hasIR||hasOW){
const target=lo+(hi-lo)*0.3; // lean toward lower end
r.teff_pellets=+target.toFixed(1);
notes.push('🚨 PASTURE WARNING: IR/overweight horses should stay off short pasture by default. If turnout is necessary, use a dry lot/track setup, grazing muzzle, or very limited early-morning access.');
notes.push('💧 Teff pellets are a lower-sugar forage-pellet option, but hay/feed testing is still the reliable way to confirm NSC.');
if(hasOW)notes.push('⚖️ Target lower end of range for weight management');
if(h.idealWeight)notes.push('🎯 Current: '+h.weight+' lb → Ideal: '+h.idealWeight+' lb (target '+Math.round((h.weight-h.idealWeight)/h.weight*100)+'% weight loss)');
notes.push('💊 Remission adds magnesium/biotin/chromium support; review overlap with AminoTrace+ before increasing dose.');
}
// Healthy visible horses (Uffie-like)
else{
r.teff_pellets=+mid.toFixed(1);
notes.push('🥣 Teff pellets are shown as the current low-sugar pellet/carry option. Add long-stem forage separately if available and tested.');
}
if(hasDig&&!notes.some(n=>n.includes('meals')))notes.push('💚 Digestive sensitive: consider splitting meals');

// Clamp negatives
FEED_TYPES.forEach(f=>{if(!f.isPasture&&r[f.id]<0)r[f.id]=0});
return{feeds:r,notes,targetRange:[lo,hi]};
}

function getAdjusted(horseId,feedId){
const key=horseId+'_'+feedId;
if(state.adjustments[key]!==undefined)return state.adjustments[key];
return null;
}
function setAdjusted(horseId,feedId,val){
state.adjustments[horseId+'_'+feedId]=val;save();
}
function clearAdjustment(horseId,feedId){
delete state.adjustments[horseId+'_'+feedId];save();
}

function getFeedTotal(h,rec){
let total=0;
FEED_TYPES.forEach(f=>{
if(f.isPasture)return;
if(!feedAppliesToHorse(f,h))return;
const adj=getAdjusted(h.id,f.id);
total+=(adj!==null?adj:rec.feeds[f.id])||0;
});
return total;
}

// Interaction warnings between supplements
const SUPP_INTERACTIONS=[
{supps:['amino_trace','health_e'],severity:'info',
message:'💡 AminoTrace+ already contributes vitamin E. When adding Health-E, check the actual IU per scoop/oz and keep the total target vet-reviewed, especially for PSSM.'},
{supps:['amino_trace','super_sport'],severity:'info',
message:'💡 Both AminoTrace+ and SuperSport are fortified products. Keep doses conservative and review selenium/mineral totals before increasing either.'},
{supps:['amino_trace','remission'],severity:'warning',
message:'⚠️ AminoTrace+ + Remission overlap in mineral/metabolic support. Remission adds magnesium, zinc, biotin, chromium, and selenium traces; review the full ration before increasing doses.'},
{supps:['assure_guard_gold','optimum_digestive'],severity:'warning',
message:'⚠️ AssureGuard Gold and Optimum Digestive Health both target gut support with probiotic/prebiotic overlap. Use one daily gut product unless your vet/nutritionist intends both.'},
{supps:['tumercicle','buteless'],severity:'warning',
message:'⚠️ Turmericle + Bute-Less can duplicate botanical comfort/inflammatory support. Check product labels, competition rules, and vet guidance before stacking.'}
];

function getSuppsForHorse(h){
const c=h.conditions;
return ALL_SUPPS.filter(s=>!s.horseIds||s.horseIds.includes(h.id)).map(s=>{
let recommended=!!s.forAll; // base supps always recommended
let reasons=[];
// Check condition-based rules
SUPP_RULES.forEach(rule=>{
if(rule.suppId===s.id && rule.conditions.some(cond=>c.includes(cond))){
recommended=true;
reasons.push(rule.reason);
}
});
if(s.id==='optimum_digestive'&&h.id==='tenor'){
recommended=false;
reasons=['Alternative to AssureGuard Gold — avoid duplicate daily gut products'];
}
if(s.id==='buteless'){
recommended=false;
reasons=['Use only when comfort/recovery support is intended; check label and medication rules'];
}
return{...s,recommended,reasons};
});
}
function getSuppState(horseId,suppId){
const key='supp_'+horseId+'_'+suppId;
if(state.supplements[key]!==undefined)return state.supplements[key];
return null;// null=use default

}

window.saveLog=function(){
const logs=JSON.parse(localStorage.getItem('hfc_logs')||'[]');
const today=new Date().toISOString().slice(0,10);
const snapshot={date:today,horses:state.horses.map(h=>{
const rec=recommend(h);
const feeds={};
FEED_TYPES.forEach(f=>{if(!f.isPasture){const adj=getAdjusted(h.id,f.id);feeds[f.id]=adj!==null?adj:(rec.feeds[f.id]||0)}});
feeds.pasture=rec.feeds.pasture;
const supps={};
getSuppsForHorse(h).forEach(s=>{
const st=getSuppState(h.id,s.id);
supps[s.id]={active:st?st.active:s.recommended,dose:st&&st.dose!==undefined?st.dose:s.dose,unit:s.unit};
});
return{id:h.id,name:h.name,weight:h.weight,feeds,supplements:supps};
}),season:state.season};
// Replace if same date exists
const existing=logs.findIndex(l=>l.date===today);
if(existing>=0)logs[existing]=snapshot;else logs.push(snapshot);
localStorage.setItem('hfc_logs',JSON.stringify(logs));
renderLogs();
alert('✅ Log saved for '+today);
};
window.loadLog=function(idx){
const logs=JSON.parse(localStorage.getItem('hfc_logs')||'[]');
const l=logs[idx];if(!l)return;
l.horses.forEach(lh=>{
FEED_TYPES.forEach(f=>{if(!f.isPasture&&lh.feeds[f.id]!==undefined)setAdjusted(lh.id,f.id,lh.feeds[f.id])});
if(lh.supplements){Object.keys(lh.supplements).forEach(sid=>{setSuppState(lh.id,sid,lh.supplements[sid])})}
});
state.season=l.season||state.season;
save();alert('📋 Loaded log from '+l.date);render();
};
window.deleteLog=function(idx){

const logs=JSON.parse(localStorage.getItem('hfc_logs')||'[]');

};

function drawChart(canvasId,logs,horseId,type){
const canvas=document.getElementById(canvasId);if(!canvas)return;
const ctx=canvas.getContext('2d');
const dpr=window.devicePixelRatio||1;
const rect=canvas.parentElement.getBoundingClientRect();
canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
ctx.scale(dpr,dpr);
const W=rect.width,H=rect.height;
const pad={top:20,right:20,bottom:40,left:45};
const plotW=W-pad.left-pad.right,plotH=H-pad.top-pad.bottom;

const dates=logs.map(l=>l.date);
/* Wong colorblind-safe palette for chart lines */
const colors=['#000000','#e69f00','#56b4e9','#009e73','#d55e00','#cc79a7','#0072b2'];

if(type==='weight'){
const vals=logs.map(l=>{const lh=l.horses.find(x=>x.id===horseId);return lh?lh.weight:null}).filter(v=>v!==null);
if(vals.length<2){ctx.fillStyle='#999';ctx.fillText('Not enough data',W/2-40,H/2);return}
const min=Math.min(...vals)*0.95,max=Math.max(...vals)*1.05;
ctx.strokeStyle='#e0d5cc';ctx.lineWidth=1;
for(let i=0;i<5;i++){
const y=pad.top+plotH*(1-i/4);
ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(W-pad.right,y);ctx.stroke();
ctx.fillStyle='#999';ctx.font='11px sans-serif';ctx.textAlign='right';
ctx.fillText((min+(max-min)*i/4).toFixed(0),pad.left-5,y+4);
}
ctx.strokeStyle=colors[0];ctx.lineWidth=2;ctx.beginPath();
vals.forEach((v,i)=>{
const x=pad.left+plotW*i/(vals.length-1);
const y=pad.top+plotH*(1-(v-min)/(max-min));
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
});ctx.stroke();
dates.forEach((d,i)=>{if(i%Math.ceil(dates.length/6)===0||i===dates.length-1){
ctx.fillStyle='#999';ctx.font='10px sans-serif';ctx.textAlign='center';
ctx.fillText(d.slice(5),pad.left+plotW*i/(dates.length-1),H-pad.bottom+16);
}});
}else{
const feedIds=FEED_TYPES.filter(f=>!f.isPasture).map(f=>f.id);
const series=feedIds.map(fid=>logs.map(l=>{
const lh=l.horses.find(x=>x.id===horseId);
return lh&&lh.feeds&&lh.feeds[fid]!==undefined?lh.feeds[fid]:0;
}));
const maxVal=Math.max(5,...series.flat())*1.1;
ctx.strokeStyle='#e0d5cc';ctx.lineWidth=1;
for(let i=0;i<5;i++){
const y=pad.top+plotH*(1-i/4);
ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(W-pad.right,y);ctx.stroke();
ctx.fillStyle='#999';ctx.font='11px sans-serif';ctx.textAlign='right';
ctx.fillText((maxVal*i/4).toFixed(1),pad.left-5,y+4);
}
series.forEach((vals,si)=>{
if(vals.every(v=>v===0))return;
ctx.strokeStyle=colors[si%colors.length];ctx.lineWidth=2;ctx.beginPath();
vals.forEach((v,i)=>{
const x=pad.left+plotW*i/Math.max(1,vals.length-1);
const y=pad.top+plotH*(1-v/maxVal);
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
});ctx.stroke();
});
// Legend
let lx=pad.left;
feedIds.forEach((fid,i)=>{
const s=series[i];if(s.every(v=>v===0))return;
ctx.fillStyle=colors[i%colors.length];
ctx.fillRect(lx,H-12,10,10);
ctx.fillStyle='#666';ctx.font='9px sans-serif';ctx.textAlign='left';
const label=FEED_TYPES.find(f=>f.id===fid).name.split(' ')[0];
ctx.fillText(label,lx+12,H-3);lx+=ctx.measureText(label).width+20;
});
dates.forEach((d,i)=>{if(i%Math.ceil(dates.length/6)===0||i===dates.length-1){
ctx.fillStyle='#999';ctx.font='10px sans-serif';ctx.textAlign='center';
ctx.fillText(d.slice(5),pad.left+plotW*i/Math.max(1,dates.length-1),H-pad.bottom+16);
}});
}
}

// ── Render: Settings ──
function renderSettings(){
const el=document.getElementById('page-settings');
let html='<div class="card"><h3>🌿 Season</h3><div class="season-toggle">';
['summer','winter'].forEach(s=>{
html+=`<div class="season-btn${state.season===s?' active':''}" onclick="setSeason('${s}')">${s==='summer'?'☀️ Summer':'❄️ Winter'}</div>`;
});
html+='</div><div style="font-size:12px;color:var(--text-light)">Season is informational; short-grazed pasture is treated as high-risk and is not counted as feed.</div></div>';

html+='<div class="card"><button class="btn btn-accent btn-block" onclick="addHorse()">＋ Add Horse</button><div style="font-size:12px;color:var(--text-light);margin-top:8px">New horses start at 800 lb with Healthy condition and Moderate activity.</div></div>';

const visibleHorseEntries=getVisibleHorseEntries();
visibleHorseEntries.forEach(({h,i:hi})=>{
html+=`<div class="card horse-settings-card"><h3>${escHtml(h.emoji)} ${escHtml(h.name)}</h3>`;
html+=`<div class="form-group"><label>Name</label><input value="${escHtml(h.name)}" oninput="updateHorseValue(${hi},'name',this.value)" onchange="renderSettings()"></div>`;
html+=`<div class="form-group"><label>Weight (lb)</label><input type="number" value="${h.weight}" oninput="updateHorseValue(${hi},'weight',+this.value||0)" onchange="renderSettings()"></div>`;
html+=`<div class="form-group"><label>Ideal Weight (lb) — leave 0 for none</label><input type="number" value="${h.idealWeight||0}" oninput="updateHorseValue(${hi},'idealWeight',+this.value||undefined)" onchange="renderSettings()"></div>`;
html+=`<div class="form-group"><label>Conditions</label><div style="display:flex;flex-wrap:wrap;gap:6px">`;
ALL_CONDITIONS.forEach(c=>{
const active=h.conditions.includes(c);
html+=`<div class="condition-chip${active?' active':''}" onclick="toggleCondition(${hi},'${c}')">${CONDITION_LABELS[c]}</div>`;
});
html+='</div></div>';
html+=`<div class="form-group"><label>Activity Level</label><div class="activity-selector">`;
ACTIVITIES.forEach(a=>{
html+=`<div class="activity-opt${h.activity===a.id?' active':''}" onclick="setActivity(${hi},'${a.id}')">${a.label}</div>`;
});
html+='</div></div>';
if(visibleHorseEntries.length>1){
html+=`<div style="text-align:right;margin-top:12px"><button class="btn btn-danger btn-sm" onclick="deleteHorse(${hi})">Delete Horse</button></div>`;
}
html+='</div>';
});

// ── Cloud Sync section ──
html+='<div class="card"><h3>☁️ Cloud Sync</h3>';
if(householdId){
html+=`<div class="sync-status ${fbConnected?'online':'offline'}"><div class="dot"></div>${fbConnected?'Connected':'Offline — changes saved locally'}</div>`;
html+=`<div class="form-group"><label>Household ID</label><div style="display:flex;gap:8px"><input value="${householdId}" id="hh_id_display" readonly style="background:var(--bg);flex:1"><button class="btn btn-outline btn-sm" onclick="navigator.clipboard.writeText('${householdId}');this.textContent='Copied!';setTimeout(()=>this.textContent='Copy',1500)">Copy</button></div></div>`;
html+='<div style="font-size:12px;color:var(--text-light);margin-bottom:12px">Share this ID with other devices to sync. Open Settings on the other device and enter the same ID.</div>';
html+='<button class="btn btn-outline btn-sm" onclick="if(confirm(\'Disconnect from cloud sync?\')){{localStorage.removeItem(\'hfc_household\');householdId=null;if(fbRef)fbRef.off();fbRef=null;renderSettings()}}">Disconnect</button>';
}else{
html+='<div style="font-size:13px;margin-bottom:12px">Sync your feed adjustments and supplement settings across all your devices.</div>';
html+='<div class="form-group"><label>Join existing household</label><div style="display:flex;gap:8px"><input id="hh_join_input" placeholder="e.g. tenor-saga-4821" style="flex:1"><button class="btn btn-accent btn-sm" onclick="const v=document.getElementById(\'hh_join_input\').value.trim();if(v){setHousehold(v);renderSettings()}">Join</button></div></div>';
html+='<div style="text-align:center;font-size:12px;color:var(--text-light);margin:8px 0">— or —</div>';
html+=`<button class="btn btn-primary btn-block" onclick="setHousehold(generateHouseholdId());renderSettings()">🆕 Create New Household</button>`;
}
html+='</div>';
html+='<div class="card"><button class="btn btn-danger btn-block" onclick="resetDefaults()">🔄 Reset All to Defaults</button></div>';
el.innerHTML=html;
}
window.setSeason=function(s){state.season=s;save();renderSettings()};
window.addHorse=function(){
const horse={id:createHorseId(),name:'New Horse',weight:800,conditions:['healthy'],activity:'moderate',emoji:'🐴'};
state.horses.push(horse);
selectedHorse=state.horses.length-1;
trendHorse=selectedHorse;
save();
renderSettings();
alert('New Horse added. Rename it below, or delete it from Settings if it was added by mistake.');
};
window.updateHorseValue=function(i,k,v){state.horses[i][k]=v;save()};
window.updateHorse=function(i,k,v){state.horses[i][k]=v;save();renderSettings()};
window.deleteHorse=function(i){
const h=state.horses[i];
if(!h||h.hidden)return;
if(getVisibleHorseEntries().length<=1){alert('Keep at least one horse in the calculator.');return;}
if(!confirm('Delete '+h.name+'? This removes its feed adjustments and supplement settings.'))return;
cleanupHorseData(h.id);
if(isDefaultHorse(h.id))h.hidden=true;
else state.horses.splice(i,1);
const next=getVisibleHorseEntries()[0];
selectedHorse=next?next.i:0;
if(!state.horses[trendHorse]||state.horses[trendHorse].hidden)trendHorse=selectedHorse;
save();
renderSettings();
};
window.toggleCondition=function(i,c){
const h=state.horses[i];
const idx=h.conditions.indexOf(c);
if(idx>=0){h.conditions.splice(idx,1)}
else{
h.conditions.push(c);
// Mutual exclusion: overweight/ir ↔ healthy
if(c==='overweight'||c==='ir'){h.conditions=h.conditions.filter(x=>x!=='healthy')}
if(c==='healthy'){h.conditions=h.conditions.filter(x=>x!=='overweight'&&x!=='ir')}
}
save();renderSettings();
};
window.setActivity=function(i,a){state.horses[i].activity=a;save();renderSettings()};
window.resetDefaults=function(){
if(!confirm('Reset everything to defaults? This will clear all adjustments.'))return;
state=defaultState();save();
localStorage.removeItem('hfc_logs');
selectedHorse=0;render();
};

// ── Init ──
render();
initFirebaseSync();

// ── Service Worker ──
if('serviceWorker' in navigator){
const swCode=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>new Response('Offline',{status:503}))))});`;
const blob=new Blob([swCode],{type:'application/javascript'});
navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
</html>
